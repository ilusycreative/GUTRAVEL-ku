symptoms(){return `<h1>${T(`Check My Symptoms`,`Cek Gejala Saya`)}</h1><p class="sub">${T(`Simple advice if your stomach feels off while traveling.`,`Saran sederhana jika perutmu tidak enak saat bepergian.`)}</p><div class="wn" style="margin-bottom:16px">${I(`alert-triangle`)}<span>${T(`This is general information, not medical advice or a diagnosis. In an emergency, call your local emergency number.`,`Ini informasi umum, bukan saran medis atau diagnosis. Dalam keadaan darurat, hubungi nomor darurat setempat.`)}</span></div><div class="g g2"><div class="c"><h3>${T(`What do you feel?`,`Apa yang kamu rasakan?`)}</h3><div class="cps" style="margin-bottom:16px">${SYL.map(x=>`<button class="cp ${SY.includes(x)?`on`:``}" onclick="tgS('${x}')">${tv(x)}</button>`).join(``)}</div>${F(T(`When did it start?`,`Kapan mulainya?`),sel(`FU`,`start`,[`Today`,`Yesterday`,`3+ days ago`]))}${F(T(`How often does it happen?`,`Seberapa sering?`),sel(`FU`,`freq`,[`1–2 times`,`3–5 times`,`6+ times`]))}${F(T(`Can you drink fluids?`,`Apakah kamu bisa minum?`),sel(`FU`,`fluids`,[`Yes`,`No`]))}${F(T(`Is it getting worse?`,`Apakah makin parah?`),sel(`FU`,`worse`,[`No`,`Yes`]))}<button class="b" style="width:100%" onclick="analyze()">${T(`Check now`,`Cek sekarang`)}</button></div><div class="c"><h3>${T(`Chat with GUTRAVEL`,`Ngobrol dengan GUTRAVEL`)}</h3><div class="chat" id="scc"></div><div class="row" style="margin-top:10px"><input id="si" placeholder="${T(`Tell me how you feel…`,`Ceritakan yang kamu rasakan…`)}" onkeydown="if(event.key=='Enter')sendS()"><button class="b" onclick="sendS()">${I(`send`)}</button></div></div></div>`},
alerts(){const f=LC.af||`All`;return `<h1>${T(`Health Alerts`,`Peringatan Kesehatan`)}</h1><p class="sub">${T(`Simple reminders for each place you may visit.`,`Pengingat sederhana untuk tiap tempat yang mungkin kamu kunjungi.`)}</p><div class="wn" style="margin-bottom:14px">${I(`flask-conical`)}<span>${T(`<b>SAMPLE DATA.</b> These are made-up examples, not real or live health news.`,`<b>DATA CONTOH.</b> Ini hanya contoh rekaan, bukan kabar kesehatan nyata atau terkini.`)}</span></div><div class="cps" style="margin-bottom:14px">${[`All`,...Object.keys(CT)].map(c=>`<button class="cp ${f==c?`on`:``}" onclick="LC.af='${c}';render()">${tv(c)}</button>`).join(``)}</div><div class="g g2">${AL.filter(a=>f==`All`||a.c==f).map(a=>`<div class="c"><div class="row sp"><span class="tag" style="background:${SC[a.sv]};color:#1c1b3a">${tv(a.sv)}</span><span class="tag" style="background:var(--pl);color:var(--p)">${T(`SAMPLE`,`CONTOH`)}</span></div><h3 style="margin:10px 0 4px">${B(a.t)}</h3><p class="mu">${I(`map-pin`)} ${a.c} · ${T(`updated`,`diperbarui`)} ${fmt(a.d,1)}<br>${T(`Source: GUTRAVEL sample data`,`Sumber: data contoh GUTRAVEL`)}</p><details><summary>${T(`What to do`,`Yang perlu dilakukan`)}</summary><p>• ${a.p.map(B).join(`<br>• `)}</p></details></div>`).join(``)}</div>`},
food(){const ck=CKL.filter((x,i)=>D.CK[i]).length,e=getEnv(D.P.dest,D.P.country),S=[T(`Safer`,`Lebih aman`),T(`Be careful`,`Hati-hati`),T(`Avoid`,`Hindari`)];return `<h1>${T(`Safe Food & Water`,`Makanan & Air Aman`)}</h1><p class="sub">${T(`Simple habits that prevent most travel tummy trouble.`,`Kebiasaan sederhana yang mencegah sakit perut saat bepergian.`)}</p><div class="g g2"><div class="c"><h3>${T(`Which foods are safer?`,`Makanan mana yang lebih aman?`)}</h3><div class="fd">${[[`🍲`,T(`Hot, fresh dishes`,`Hidangan panas, baru dimasak`),`#DFF5E8`,0],[`🥥`,T(`Sealed coconut`,`Kelapa utuh`),`#DFF5E8`,0],[`🥗`,T(`Raw salad`,`Salad mentah`),`#FFF1CF`,1],[`🍉`,T(`Pre-cut fruit`,`Buah yang sudah dipotong`),`#FFF1CF`,1],[`🧊`,T(`Ice of unknown origin`,`Es batu tak jelas asalnya`),`#FDE3E5`,2],[`🍤`,T(`Lukewarm seafood`,`Seafood suam-suam kuku`),`#FDE3E5`,2]].map(x=>`<div style="background:${x[2]};color:#1c1b3a"><b>${x[0]}</b>${x[1]}<br><small>${S[x[3]]}</small></div>`).join(``)}</div></div><div class="c"><h3>${T(`My checklist`,`Daftar cek saya`)} <span class="mu" style="font-weight:500">${ck}/${CKL.length}</span></h3>${bar(ck/CKL.length*100)}<div style="margin-top:8px">${CKL.map((x,i)=>cki(x,i)).join(``)}</div></div></div><div class="c"><h3>${T(`Easy safety guide`,`Panduan keamanan`)}</h3><details><summary>${T(`Food`,`Makanan`)}</summary><p>${T(`Eat freshly cooked food. Skip food that was stored badly. Look at how clean the stall is. Wash your hands before eating.`,`Makan makanan yang baru dimasak. Hindari makanan yang disimpan sembarangan. Lihat kebersihan warungnya. Cuci tangan sebelum makan.`)}</p></details><details><summary>${T(`Water`,`Air`)}</summary><p>${T(`Choose drinking water that is treated or sealed. Avoid ice from unknown sources. Keep your water in a clean, closed bottle.`,`Pilih air minum yang sudah diolah atau tersegel. Hindari es batu dari sumber tak jelas. Simpan air di botol bersih yang tertutup.`)}</p></details><details><summary>${T(`Personal hygiene`,`Kebersihan diri`)}</summary><p>${T(`Wash hands with soap, keep your things clean, and use clean utensils when handling food.`,`Cuci tangan pakai sabun, jaga barangmu tetap bersih, dan gunakan alat makan yang bersih.`)}</p></details><details open><summary>${T(`In ${esc(D.P.dest)}`,`Di ${esc(D.P.dest)}`)}</summary><p>${e.sum||T(`Run a risk check to get AI tips for this place.`,`Jalankan cek risiko untuk mendapat tips AI untuk tempat ini.`)}</p></details></div>`},
locator(){const fs=FT.map(f=>({n:`${LC.city} ${T(f[0],f[1])}`,t:B(f[2]),s:B(f[3]),x:f[4],a:`${12+f[4][0]} Demo Street, ${LC.city}`,ph:`+00 000 000 0${f[4][0]}`,km:(f[4][0]/20).toFixed(1)})),f=fs[LC.sel];return `<h1>${T(`Find a Clinic`,`Cari Klinik`)}</h1><p class="sub">${T(`Find medical help near ${LC.city}.`,`Temukan bantuan medis di dekat ${LC.city}.`)}</p><div class="row" style="margin-bottom:14px"><input id="lq" placeholder="${T(`Search a city, e.g. Bangkok`,`Cari kota, mis. Bangkok`)}" onkeydown="if(event.key=='Enter')srch()"><button class="b" onclick="srch()">${T(`Search`,`Cari`)}</button></div><div class="wn" style="margin-bottom:14px">${I(`flask-conical`)}<span>${T(`Sample places for demonstration only. Not linked to a real map or medical database.`,`Tempat contoh hanya untuk demo. Tidak terhubung ke peta atau data medis asli.`)}</span></div><div class="g g2"><div class="c"><div class="map">${fs.map((x,i)=>`<div class="pin ${i==LC.sel?`on`:``}" style="left:${x.x[0]}%;top:${x.x[1]}%" onclick="LC.sel=${i};render()"></div>`).join(``)}</div><div style="margin-top:10px">${fs.map((x,i)=>`<div class="rs ${i==LC.sel?`on`:``}" onclick="LC.sel=${i};render()"><span class="ib" style="width:38px;height:38px">${I(`hospital`)}</span><div style="flex:1"><b>${x.n}</b><br><span class="mu">${x.t} · ${x.km} km (${T(`sample`,`contoh`)})</span></div></div>`).join(``)}</div></div><div class="c"><h3>${f.n}</h3><span class="tag" style="background:var(--pl);color:var(--p)">${f.t}</span><div class="li">${I(`map-pin`)}${f.a}</div><div class="li">${I(`phone`)}${f.ph}</div><div class="li">${I(`stethoscope`)}${f.s}</div><button class="b" style="margin-top:12px;width:100%" onclick="toast(T('Directions would open in a real map app (demo)','Di aplikasi nyata, petunjuk arah akan terbuka di peta (demo)'))">${I(`navigation`)} ${T(`Get directions`,`Petunjuk arah`)}</button></div></div>`},
